<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trace Expert City</title><style>
:root{--ink:#18243a;--muted:#61708a;--line:#d9e1ed;--canvas:#f5f7fb;--brand:#2f67e8;--ok:#087c52;--bad:#b32936}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.45 Arial,sans-serif}header{padding:40px max(24px,calc((100% - 1100px)/2));color:#fff;background:linear-gradient(115deg,#142b58,#2f67e8)}h1,h2,h3{margin:0}header p{margin:8px 0 0;color:#dce8ff}main{width:min(1100px,calc(100% - 36px));margin:28px auto 60px}.panel,.space{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 5px 18px #15233a0b}.panel{padding:22px}.space-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:16px}.space{padding:0;text-align:left;overflow:hidden;cursor:pointer}.space.selected{border:3px solid var(--brand)}.space img{width:100%;height:150px;object-fit:cover;display:block}.space-body{padding:16px}.meta,.small{color:var(--muted)}.tag{display:inline-block;margin:3px 3px 0 0;padding:3px 8px;border-radius:12px;background:#edf3ff;color:#2456c4;font-size:12px}label{display:block;margin-top:12px;font-weight:bold;font-size:14px}input,select,textarea,button{width:100%;margin-top:5px;padding:10px;border:1px solid #b8c5d8;border-radius:8px;font:inherit}textarea{resize:vertical}button{margin-top:17px;border:0;background:var(--brand);color:#fff;font-weight:bold;cursor:pointer}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;gap:8px;align-items:center;margin-top:8px;font-weight:normal}.check input{width:auto;margin:0}.notice{display:none;margin-top:15px;padding:11px;border-radius:8px;font-weight:bold}.notice.ok{display:block;color:var(--ok);background:#e5f6ed}.notice.error{display:block;color:var(--bad);background:#fdebed}.hide{display:none}.booking-list{margin:14px 0 0;padding:0;list-style:none}.booking-list li{padding:10px 0;border-bottom:1px solid var(--line)}@media(max-width:740px){.fields{grid-template-columns:1fr}}
</style></head><body><header><h1>Trace Expert City</h1><p>Select a space, then create its booking.</p></header><main><section class="panel"><h2>Select a space</h2><div id="spaces" class="space-grid"></div></section><section id="bookingPanel" class="panel hide" style="margin-top:22px"><h2 id="title"></h2><p id="details" class="small"></p><form id="form"><div class="fields"><label>Customer name<input id="name" required></label><label>Contact details<input id="contact" required></label></div><div id="dates" class="fields"><label>Start date<input id="start" type="date"></label><label>End date<input id="end" type="date"></label></div><div id="sameDayTimes" class="fields hide"><label>Start time<input id="startTime" type="time"></label><label>End time<input id="endTime" type="time"></label></div><div id="deskTimes" class="fields hide"><label>Booking date<input id="deskDate" type="date"></label><label>Start time<input id="deskStart" type="time"></label><label>End time<input id="deskEnd" type="time"></label></div><label>Will alcohol be used during this booking?<select id="alcohol"><option value="false">No</option><option value="true">Yes</option></select></label><label>Extra services</label><div class="fields"><label class="check"><input type="checkbox" name="service" value="Projector"> Projector</label><label class="check"><input type="checkbox" name="service" value="Sound system"> Sound system</label><label class="check"><input type="checkbox" name="service" value="Decoration"> Decoration</label></div><label>Notes<textarea id="notes" rows="3"></textarea></label><button>Create booking</button></form><div id="notice" class="notice"></div></section><section class="panel" style="margin-top:22px"><h2>Bookings</h2><ul id="list" class="booking-list"></ul></section></main><script>
const $=s=>document.querySelector(s);let spaces=[],active;const img={training:'training-room.png',room:'meeting-room.png',auditorium:'auditorium.png',desk:'focus-desk-v2.png'},plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)},fmt=d=>new Date(`${d}T00:00:00`).toLocaleDateString();function note(m,t){$('#notice').className=`notice ${t}`;$('#notice').textContent=m}function draw(){ $('#spaces').innerHTML=spaces.map(s=>`<button class="space ${active?.id===s.id?'selected':''}" data-id="${s.id}"><img src="images/${img[s.type]}" alt="${s.name}"><div class="space-body"><h3>${s.name}</h3><p class="meta">${s.type} · ${s.capacity} people</p>${s.amenities.map(a=>`<span class="tag">${a}</span>`).join('')}<p><strong>LKR ${s.dailyRate.toLocaleString()} / day</strong></p></div></button>`).join('');document.querySelectorAll('.space').forEach(b=>b.onclick=()=>pick(b.dataset.id))}function syncTimes(){const same=['training','room'].includes(active?.type)&&$('#start').value&&$('#start').value===$('#end').value;$('#sameDayTimes').classList.toggle('hide',!same)}function pick(id){active=spaces.find(s=>s.id===id);draw();$('#bookingPanel').classList.remove('hide');$('#title').textContent=`Book ${active.name}`;$('#details').textContent=`${active.amenities.join(' · ')} · LKR ${active.dailyRate.toLocaleString()} per day`;const desk=active.type==='desk';$('#dates').classList.toggle('hide',desk);$('#deskTimes').classList.toggle('hide',!desk);syncTimes();$('#bookingPanel').scrollIntoView({behavior:'smooth'})}function desc(b){return b.bookingDate?`${fmt(b.bookingDate)} · ${b.startTime}–${b.endTime}`:`${fmt(b.startDate)}${b.startTime?` · ${b.startTime}–${b.endTime}`:` to ${fmt(b.endDate)}`}`}async function bookings(){const b=await(await fetch('/api/bookings')).json();$('#list').innerHTML=b.length?b.map(x=>`<li><strong>${spaces.find(s=>s.id===x.spaceId)?.name||x.spaceId}</strong><br><span class="small">${x.customerName} · ${desc(x)}</span></li>`).join(''):'<li class="small">No bookings yet.</li>'}async function load(){spaces=await(await fetch('/api/spaces')).json();draw();bookings()}$('#start').onchange=$('#end').onchange=syncTimes;$('#form').onsubmit=async e=>{e.preventDefault();const b={spaceId:active.id,customerName:$('#name').value,customerContact:$('#contact').value,usesAlcohol:$('#alcohol').value==='true',services:[...document.querySelectorAll('input[name=service]:checked')].map(x=>x.value),notes:$('#notes').value};if(active.type==='desk')Object.assign(b,{bookingDate:$('#deskDate').value,startTime:$('#deskStart').value,endTime:$('#deskEnd').value});else Object.assign(b,{startDate:$('#start').value,endDate:$('#end').value,...(!$('#sameDayTimes').classList.contains('hide')?{startTime:$('#startTime').value,endTime:$('#endTime').value}:{})});const r=await fetch('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json();if(!r.ok)return note(d.error,'error');note(`Booking created for ${d.customerName}.`,'ok');bookings()};$('#start').value=plus(1);$('#end').value=plus(2);$('#deskDate').value=plus(1);$('#deskStart').value=$('#startTime').value='09:00';$('#deskEnd').value=$('#endTime').value='10:00';load().catch(()=>note('Could not connect to the booking API.','error'));
</script></body></html>

<script src="policy.js"></script>
